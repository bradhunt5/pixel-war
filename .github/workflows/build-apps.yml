# Builds the Android APK (Capacitor) and Windows installers (Electron).
# Runs when a version tag such as v1.2.0 is pushed, or by hand from the
# Actions tab. Tagged builds are attached to a GitHub Release.
name: Build apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          npm run web
          npx cap add android
          npx cap sync android
      - name: Use the Pixel War icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open('icons/icon-512.png')
          res = Path('android/app/src/main/res')
          for folder, size in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              icon = src.resize((size, size), Image.NEAREST)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  icon.save(res / f'mipmap-{folder}' / name)
          PY
          # Drop the default adaptive icon so Android uses the images above.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PixelWar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelWar-android
          path: PixelWar.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the Windows installers
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: PixelWar-windows
          path: |
            dist/PixelWar-Setup.exe
            dist/PixelWar-portable.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/PixelWar.apk
            out/PixelWar-Setup.exe
            out/PixelWar-portable.exe
